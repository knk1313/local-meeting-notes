name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # 録音・圧縮は macOS 専用。Linux でも走らせ、OS 依存のテストが skip されることを確かめる。
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 依存をインストール
        run: pip install -r requirements.txt
      - name: テスト
        # 実行する人の .env に左右されないことを確かめるため、キーは設定しない。
        run: python -m unittest discover -s tests -t tests
